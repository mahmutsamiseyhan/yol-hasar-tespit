<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5394">
<title>Yol Hasarı Bildir · Bursa</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<style>
  :root {
    --bg: #f4f6f9; --panel: #fff; --ink: #1c2430; --muted: #5f6b7a; --line: #dfe4ea; --brand: #0b5394;
    --ok: #2e7d32; --warn: #ef6c00; --err: #c62828;
    --kritik: #c62828; --yuksek: #ef6c00; --orta: #f9a825; --dusuk: #2e7d32;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
  header { background: var(--brand); color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 28px; }
  .card { background: var(--panel); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .step { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 10px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: #e3ebf5; color: var(--brand); display: grid; place-items: center; font-size: 14px; flex: none; }
  .num.done { background: var(--ok); color: #fff; }
  .status { font-size: 14px; color: var(--muted); }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.err { color: var(--err); }
  #map { height: 160px; border-radius: 8px; margin-top: 10px; }
  .btn { display: block; width: 100%; text-align: center; padding: 14px; border-radius: 10px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.ghost { background: #eef2f7; color: var(--ink); margin-top: 8px; }
  .btn.send { background: var(--ok); color: #fff; font-size: 17px; padding: 16px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .link { background: none; border: 0; color: var(--brand); font: inherit; font-size: 14px; padding: 8px 0 0; cursor: pointer; text-decoration: underline; }
  input[type=file] { display: none; }
  #preview { width: 100%; border-radius: 8px; margin-top: 10px; display: block; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg label { border: 2px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; font-size: 15px; cursor: pointer; }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--brand); font-weight: 700; }
  .seg label:has(input:checked) { border-color: var(--brand); background: #eef4fb; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
  .consent input { width: 22px; height: 22px; margin-top: 1px; flex: none; }
  .result img { width: 100%; border-radius: 8px; margin: 10px 0; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 14px; }
  .lvl-kritik { background: var(--kritik); } .lvl-yuksek { background: var(--yuksek); } .lvl-orta { background: var(--orta); color: #222; } .lvl-dusuk { background: var(--dusuk); }
  .big { font-size: 20px; font-weight: 700; margin: 6px 0; }
  ul.notes { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
  ul.notes li { background: #f6f8fb; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  ul.notes li.uyari { background: #fff4e5; }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 8px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 20px; }
</style>
</head>
<body>
<header>
  <h1>Yol Hasarı Bildir</h1>
  <p>Bursa Yol Hasarı Karar Destek Sistemi</p>
</header>
<main>
  <div id="form">
    <div class="card">
      <div class="step"><span class="num" id="n1">1</span>Konum</div>
      <div class="status" id="locStatus">Konum alınıyor…</div>
      <div id="map" hidden></div>
      <button class="link" id="retryLoc" hidden>Konumu yeniden al</button>
    </div>

    <div class="card">
      <div class="step"><span class="num" id="n2">2</span>Fotoğraf</div>
      <label class="btn primary" for="camera">Fotoğraf çek</label>
      <input id="camera" type="file" accept="image/*" capture="environment">
      <input id="gallery" type="file" accept="image/*">
      <button class="link" id="pickGallery" type="button">Galeriden seç</button>
      <div class="status" id="photoStatus" style="margin-top:6px">Hasarı yakından ve yolu gösterecek şekilde çekin.</div>
      <img id="preview" hidden alt="Seçilen fotoğraf">
    </div>

    <div class="card">
      <div class="step"><span class="num" id="n3">3</span>Bildiren</div>
      <div class="seg">
        <label><input type="radio" name="source" value="vatandas" checked><span>Vatandaş</span></label>
        <label><input type="radio" name="source" value="saha_ekibi"><span>Belediye saha ekibi</span></label>
      </div>
    </div>

    <div class="card">
      <label class="consent"><input type="checkbox" id="consent">
        <span>Fotoğrafımın ve konumumun yol hasarı bildirimi amacıyla işlenmesine onay veriyorum. Fotoğraftaki yüzler ve plakalar kaydedilmeden önce otomatik bulanıklaştırılır.</span></label>
    </div>

    <button class="btn send" id="send" disabled>Bildirimi gönder</button>
    <div class="status" id="sendHint" style="text-align:center;margin-top:8px">Konum, fotoğraf ve onay gerekli.</div>
  </div>

  <div id="result" hidden></div>
</main>
<footer>Bildiriminiz anında belediyenin iş takip ekranına düşer.</footer>

<script src="/static/vendor/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const LEVEL_TR = { kritik: "Kritik", yuksek: "Yüksek", orta: "Orta", dusuk: "Düşük" };
const MAX_SIDE = 1920;      // gönderilmeden önce fotoğraf bu boyuta küçültülür (mobil veri dostu)
const GOOD_ACCURACY = 15;   // metre; sistemin birleştirme yarıçapı
const state = { pos: null, blob: null, watch: null, map: null, marker: null, circle: null };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function setStatus(el, text, kind = "") { el.textContent = text; el.className = "status " + kind; }

function refresh() {
  const ready = state.pos && state.blob && $("consent").checked;
  $("send").disabled = !ready;
  $("n1").classList.toggle("done", !!state.pos);
  $("n2").classList.toggle("done", !!state.blob);
  $("n3").classList.add("done");
  const missing = [!state.pos && "konum", !state.blob && "fotoğraf", !$("consent").checked && "onay"].filter(Boolean);
  setStatus($("sendHint"), missing.length ? `Eksik: ${missing.join(", ")}.` : "Hazır.", missing.length ? "" : "ok");
}

// ---------- Konum (zorunlu) ----------
function startLocation() {
  $("retryLoc").hidden = true;
  if (!window.isSecureContext) {
    setStatus($("locStatus"), "Konum ve kamera yalnızca güvenli (https://) bağlantıda çalışır. Sayfayı https adresinden açın.", "err");
    return;
  }
  if (!("geolocation" in navigator)) { setStatus($("locStatus"), "Bu cihaz konum desteklemiyor.", "err"); return; }
  setStatus($("locStatus"), "Konum alınıyor… Konum izni isteğine \"İzin ver\" deyin.");
  if (state.watch !== null) navigator.geolocation.clearWatch(state.watch);
  state.watch = navigator.geolocation.watchPosition(onPosition, onPositionError,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  // Doğruluk iyileşmeyi bıraktığında pili korumak için takibi bitir
  setTimeout(() => { if (state.watch !== null && state.pos) { navigator.geolocation.clearWatch(state.watch); state.watch = null; } }, 30000);
}

function onPosition(p) {
  const acc = Math.round(p.coords.accuracy);
  if (state.pos && acc > state.pos.acc) return; // yalnızca daha iyi ölçümü al
  state.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc };
  const kind = acc <= GOOD_ACCURACY ? "ok" : acc <= 50 ? "warn" : "err";
  const tip = acc <= GOOD_ACCURACY ? "" : " Açık havada birkaç saniye bekleyin, doğruluk iyileşir.";
  setStatus($("locStatus"), `Konum alındı: ±${acc} m${tip}`, kind);
  $("retryLoc").hidden = false;
  showMap();
  refresh();
  if (acc <= 8 && state.watch !== null) { navigator.geolocation.clearWatch(state.watch); state.watch = null; }
}

function onPositionError(err) {
  const msg = { 1: "Konum izni verilmedi. Bildirim için konum zorunludur: tarayıcı ayarlarından bu siteye konum izni verin.",
                2: "Konum belirlenemedi. GPS'in açık olduğundan emin olun.", 3: "Konum zaman aşımına uğradı." }[err.code] || err.message;
  if (!state.pos) setStatus($("locStatus"), msg, "err");
  $("retryLoc").hidden = false;
}

function showMap() {
  const ll = [state.pos.lat, state.pos.lon];
  $("map").hidden = false;
  if (!state.map) {
    state.map = L.map("map", { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(state.map);
    state.circle = L.circle(ll, { radius: state.pos.acc, color: "#0b5394", weight: 1, fillOpacity: 0.12 }).addTo(state.map);
    state.marker = L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: "#0b5394", fillOpacity: 1 }).addTo(state.map);
  }
  state.circle.setLatLng(ll).setRadius(state.pos.acc);
  state.marker.setLatLng(ll);
  state.map.invalidateSize();  // kutu yeni görünür oldu: harita boyutunu yeniden ölç
  state.map.setView(ll, 17);
}

$("retryLoc").onclick = () => { state.pos = null; refresh(); startLocation(); };

// ---------- Fotoğraf ----------
async function onPhoto(file, fromGallery) {
  if (!file) return;
  setStatus($("photoStatus"), "Fotoğraf hazırlanıyor…");
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
    canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
    state.blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.88));
    $("preview").src = URL.createObjectURL(state.blob); $("preview").hidden = false;
    const kb = Math.round(state.blob.size / 1024);
    setStatus($("photoStatus"), `Fotoğraf hazır (${canvas.width}×${canvas.height}, ${kb} KB).` +
      (fromGallery ? " Not: konum olarak şu anki konumunuz kullanılır." : ""), "ok");
  } catch (e) {
    state.blob = null;
    setStatus($("photoStatus"), "Fotoğraf okunamadı: " + e.message, "err");
  }
  refresh();
}
$("camera").onchange = (e) => onPhoto(e.target.files[0], false);
$("gallery").onchange = (e) => onPhoto(e.target.files[0], true);
$("pickGallery").onclick = () => $("gallery").click();
$("consent").onchange = refresh;

// ---------- Gönder ----------
$("send").onclick = async () => {
  const btn = $("send");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Gönderiliyor ve analiz ediliyor…`;
  const fd = new FormData();
  fd.append("image", state.blob, "bildirim.jpg");
  fd.append("lat", state.pos.lat); fd.append("lon", state.pos.lon);
  fd.append("konum_dogrulugu_m", state.pos.acc);
  fd.append("source", document.querySelector("input[name=source]:checked").value);
  try {
    const res = await fetch("/api/analyze-road", { method: "POST", body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Gönderilemedi");
    showResult(d);
  } catch (e) {
    setStatus($("sendHint"), "Hata: " + e.message, "err");
    btn.disabled = false;
  } finally {
    btn.textContent = "Bildirimi gönder";
  }
};

function showResult(d) {
  const notes = (d.degerlendirme || []).filter((n) => n.tur !== "bilgi").map((n) => `<li class="${n.tur}">${esc(n.metin)}</li>`).join("");
  let head;
  if (d.ariza) {
    const p = d.ariza.properties;
    head = `<div class="status ok">Bildiriminiz alındı.</div>
      <div class="big">${esc(p.hasar_adi)}</div>
      <span class="badge lvl-${p.oncelik_seviyesi}">${p.oncelik_puani} · ${LEVEL_TR[p.oncelik_seviyesi]}</span>
      <p style="margin:10px 0 0">İş emri no: <b>${esc(p.is_emri_no)}</b>${d.mevcut_kayitla_birlestirildi ? `<br>Bu nokta daha önce bildirilmiş; kaydın önceliği güncellendi (${p.bildirim_sayisi}. bildirim).` : ""}</p>`;
  } else {
    head = `<div class="status ok">Bildiriminiz alındı.</div><div class="big">Hasar tespit edilmedi</div>
      <p style="margin:6px 0 0;font-size:14px;color:#5f6b7a">Fotoğrafta belirgin bir yol hasarı bulunamadı. Hasar varsa daha yakından tekrar çekmeyi deneyin.</p>`;
  }
  $("result").innerHTML = `<div class="card result">${head}
      ${d.onizleme ? `<img src="${d.onizleme}" alt="Analiz sonucu">` : ""}
      ${notes ? `<ul class="notes">${notes}</ul>` : ""}
      <button class="btn primary" id="again" style="margin-top:12px">Yeni bildirim</button></div>`;
  $("form").hidden = true; $("result").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("again").onclick = () => {
    state.blob = null; $("preview").hidden = true; $("camera").value = ""; $("gallery").value = "";
    setStatus($("photoStatus"), "Hasarı yakından ve yolu gösterecek şekilde çekin.");
    $("result").hidden = true; $("form").hidden = false; refresh();
  };
}

refresh();
startLocation();
</script>
</body>
</html>
