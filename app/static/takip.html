<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5394">
<title>Bildirim Takibi · Bursa Yol Hasarı</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<style>
  :root { --bg: #f4f6f9; --panel: #fff; --ink: #1c2430; --muted: #5f6b7a; --line: #dfe4ea; --brand: #0b5394;
          --ok: #2e7d32; --err: #a12622; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; }
  header h1 { margin: 0; font-size: 19px; } header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 28px; }
  .card { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 18px;
          letter-spacing: 2px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  button { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .err { background: #fdecea; color: var(--err); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .title { font-size: 20px; font-weight: 700; margin: 0; }
  .meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #e3ebf5; color: var(--brand); margin-top: 8px; }
  .pill.done { background: #e9f5ec; color: #1e5e2c; } .pill.closed { background: #eef0f3; color: #3d4652; }
  ol.steps { list-style: none; margin: 16px 0 0; padding: 0; }
  ol.steps li { position: relative; padding: 0 0 18px 36px; }
  ol.steps li:last-child { padding-bottom: 0; }
  ol.steps li::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
  ol.steps li:last-child::before { display: none; }
  ol.steps li.done::before { background: var(--ok); }
  .dot { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: #fff;
         display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
  li.done .dot { background: var(--ok); border-color: var(--ok); }
  .step-name { font-weight: 600; } li:not(.done) .step-name { color: var(--muted); }
  .step-date { font-size: 13px; color: var(--muted); }
  #map { height: 170px; border-radius: 8px; margin-top: 12px; }
  .photo img { width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .mine { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mine button { background: #eef2f7; color: var(--ink); font-weight: 500; padding: 6px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 16px 20px; }
  footer a { color: var(--brand); }
</style>
</head>
<body>
<header>
  <h1>Bildirim Takibi</h1>
  <p>Bursa Yol Hasarı Karar Destek Sistemi</p>
</header>
<main>
  <div class="card">
    <form id="form">
      <input id="code" placeholder="ABCD-1234" maxlength="12" autocomplete="off" aria-label="Takip kodu" required>
      <button type="submit">Sorgula</button>
    </form>
    <div class="hint">Takip kodu, bildirimi gönderdiğinizde ekranda gösterilir.</div>
    <div id="mine" hidden><div class="hint">Bu cihazdan gönderdiğiniz bildirimler:</div><div class="mine" id="mineList"></div></div>
  </div>
  <div id="out"></div>
</main>
<footer><a href="/bildir">Yeni hasar bildir</a></footer>
<script src="/static/vendor/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (ts) => ts ? new Date(ts).toLocaleString("tr-TR", { dateStyle: "long", timeStyle: "short" }) : "";
let map = null;

function savedCodes() {
  try { return JSON.parse(localStorage.getItem("yh_takip") || "[]"); } catch (_) { return []; }
}

function renderMine() {
  const codes = savedCodes();
  $("mine").hidden = !codes.length;
  $("mineList").innerHTML = codes.map((c) => `<button type="button" data-code="${esc(c.kod)}">${esc(c.kod)}${c.tarih ? " · " + esc(new Date(c.tarih).toLocaleDateString("tr-TR")) : ""}</button>`).join("");
  $("mineList").querySelectorAll("button").forEach((b) => (b.onclick = () => { $("code").value = b.dataset.code; lookup(); }));
}

async function lookup() {
  const code = $("code").value.trim();
  if (!code) return;
  history.replaceState(null, "", "/takip?kod=" + encodeURIComponent(code));
  $("out").innerHTML = `<div class="card">Sorgulanıyor…</div>`;
  try {
    const res = await fetch("/api/takip/" + encodeURIComponent(code));
    const d = await res.json();
    if (!res.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Sorgulanamadı.");
    render(d);
  } catch (e) {
    $("out").innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`;
  }
}

function render(d) {
  const closed = d.durum === "onarildi" || d.durum === "yanlis_tespit";
  const steps = d.adimlar.map((s, i) => `<li class="${s.tamam ? "done" : ""}">
      <span class="dot">${s.tamam ? "✓" : ""}</span>
      <div class="step-name">${esc(s.ad)}</div>
      <div class="step-date">${s.tamam ? esc(fmt(s.tarih)) : "Bekleniyor"}</div></li>`).join("");
  const where = [d.yol_adi, d.ilce].filter(Boolean).map(esc).join(", ");
  $("out").innerHTML = `
    <div class="card">
      <p class="title">${esc(d.hasar_adi)}</p>
      <div class="meta">İş emri ${esc(d.is_emri_no)}${where ? " · " + where : ""}</div>
      <span class="pill ${d.durum === "onarildi" ? "done" : closed ? "closed" : ""}">${esc(d.durum_adi)}</span>
      ${d.bildirim_sayisi > 1 ? `<div class="hint">Bu nokta toplam ${d.bildirim_sayisi} kez bildirildi; öncelik buna göre artırıldı.</div>` : ""}
      <ol class="steps">${steps}</ol>
    </div>
    ${d.onarim_goruntu_url ? `<div class="card photo"><b>Onarım sonrası</b><div class="hint" style="margin-top:2px">Saha ekibinin onarımdan sonra çektiği fotoğraf</div><img src="${esc(d.onarim_goruntu_url)}" alt="Onarım sonrası yol"></div>` : ""}
    <div class="card"><b>Bildirim konumu</b><div id="map"></div></div>`;
  const ll = [d.konum.enlem, d.konum.boylam];
  if (map) map.remove();
  map = L.map("map", { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false }).setView(ll, 17);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
  L.circleMarker(ll, { radius: 8, color: "#fff", weight: 2, fillColor: "#0b5394", fillOpacity: 1 }).addTo(map);
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); lookup(); });
renderMine();
const initial = new URLSearchParams(location.search).get("kod");
if (initial) { $("code").value = initial; lookup(); }
</script>
</body>
</html>
