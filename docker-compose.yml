services:
  api:
    build: .
    image: yol-hasar-tespit:latest
    ports:
      - "${PORT:-8000}:8000"        # başka port için: PORT=8001 docker compose up
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_DIR: /app/models/custom
      DATA_DIR: /app/data/runtime
      DB_PATH: /app/data/runtime/yol_hasar.db
    volumes:
      - ./models:/app/models/custom:ro            # Colab'da eğitilen best.pt buraya
      - yol_hasar_data:/app/data/runtime          # veritabanı + maskelenmiş görseller
    restart: unless-stopped

volumes:
  yol_hasar_data:
