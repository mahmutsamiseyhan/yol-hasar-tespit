services:
  api:
    build: .
    image: yol-hasar-tespit:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_DIR: /app/models/custom          # best-seg.pt varsa o, yoksa best.pt kullanılır
      DATA_DIR: /app/data/runtime
      DB_PATH: /app/data/runtime/yol_hasar.db
    volumes:
      - ./models:/app/models/custom:ro            # Colab'da eğitilen best.pt / best-seg.pt
      - yol_hasar_data:/app/data/runtime          # veritabanı + maskelenmiş görseller
    restart: unless-stopped

volumes:
  yol_hasar_data:
